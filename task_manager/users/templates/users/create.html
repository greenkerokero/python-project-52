{% extends 'base.html' %}
{% load i18n %}

{% block header %}
{% translate "Users" %}
{% endblock %}

{% load django_bootstrap5 %}
{% block content %}
<h1>Регистрация</h1>

<form action="{% url 'users:create' %}" method="post">
  {% csrf_token %}
  {% bootstrap_form form %}
  <input type="submit" value="Зарегистрировать">
</form>
{% endblock %}
