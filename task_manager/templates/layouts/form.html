{% extends "layouts/base.html" %}
{% load i18n %}

{% load django_bootstrap5 %}
{% block content %}
<h1>{% block form_title %}{% endblock %}</h1>

{% block notifications %}{% endblock %}

<form action="{% block url_name %}{% endblock %}" method="post">
  {% csrf_token %}
  {% bootstrap_form form %}
  <input type="submit" value="{% block button_text %}{% endblock %}">
</form>
{% endblock %}
