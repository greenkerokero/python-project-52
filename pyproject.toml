[project]
name = "hexlet-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.0.3",
    "django-bootstrap5>=26.2",
    "django-filter>=25.2",
    "gunicorn>=25.3.0",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.2",
    "rollbar>=1.3.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "coverage>=7.13.5",
    "ruff>=0.15.9",
]

[tool.ruff]
exclude = [
    "migrations",
    "settings.py",
]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "I",
    "F",
    "N",
    "UP",
    "SIM",
]

[tool.ruff.format]
quote-style = "single"

[tool.coverage.run]
branch = true
source = ["task_manager"]
omit = [
    "*/migrations/*",
    "manage.py",
    "task_manager/settings.py",
    "*/tests.py",
    "*/tests/*",
    "*/apps.py"
]
